<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP32 Device Control</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <section class="card" aria-labelledby="dashboard-title">
        <div class="header">
          <div>
            <p class="eyebrow">IoT Dashboard</p>
            <h1 id="dashboard-title">Device Control</h1>
          </div>
          <span id="connectionBadge" class="connection-badge connecting">
            <span class="dot"></span>
            <span id="connectionText">Connecting...</span>
          </span>
        </div>

        <div id="statusPanel" class="status-panel" aria-live="polite">
          <span class="status-label">Current status</span>
          <strong id="deviceStatus" class="device-status loading">Loading</strong>
        </div>

        <div id="loader" class="loader" role="status" aria-label="Loading">
          <span></span>
        </div>

        <div class="controls">
          <button id="onButton" class="control-button on" type="button" disabled>
            Turn ON
          </button>
          <button id="offButton" class="control-button off" type="button" disabled>
            Turn OFF
          </button>
        </div>

        <p id="errorMessage" class="error-message" role="alert"></p>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
